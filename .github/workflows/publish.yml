name: CI and npm publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
      - name: Version in src/server.ts matches package.json
        run: |
          grep -q "version: \"$(jq -r .version package.json)\"" src/server.ts

  # Publishes when package.json on main has a version that is not on npm yet.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance, no NPM_TOKEN
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # npm >= 11.5 is required for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already on npm
        id: check
        run: |
          name=$(jq -r .name package.json); version=$(jq -r .version package.json)
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already published, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      # prepublishOnly runs typecheck, tests and build before upload.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
